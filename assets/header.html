<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sequence distillation — header</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #000;
    }
    .frame {
      width: 1280px;
      height: 720px;
      position: relative;
      background: #000 url("scene.jpg") left center / auto 100% no-repeat;
    }
    .type {
      position: absolute;
      top: 44px;
      right: 48px;
      width: 430px;
      text-align: right;
    }
    .kicker {
      margin: 0 0 12px;
      font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #e4b089;
    }
    h1 {
      margin: 0;
      font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif;
      font-weight: 500;
      font-size: 48px;
      line-height: 0.98;
      letter-spacing: -0.03em;
      color: #ffffff;
    }
    p {
      margin: 14px 0 0;
      font-family: "Avenir Next", "Avenir", "Helvetica Neue", sans-serif;
      font-weight: 400;
      font-size: 24px;
      line-height: 1.25;
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="type">
      <p class="kicker">Hard labels</p>
      <h1>Sequence<br>distillation</h1>
      <p>Grok 4.7 → Qwen 0.5B</p>
    </div>
  </div>
</body>
</html>
